name: Actualizar datos

on:
  schedule:
    - cron: "0 12 * * 1"   # lunes 7:00 a. m. hora Colombia (12:00 UTC)
  workflow_dispatch:        # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python pipeline.py --paginas 2
      - name: Guardar datos actualizados
        run: |
          git config user.name "observatorio-bot"
          git config user.email "observatorio-bot@users.noreply.github.com"
          git add data/ofertas.csv data/ofertas_habilidades.csv
          git diff --cached --quiet || git commit -m "datos: actualización semanal $(date +%F)"
          git push
